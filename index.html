<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#f5f6fa;padding:40px;overflow-x:hidden;transition:background 0.3s,color 0.3s;}
.dark-mode{background:#1e293b;color:#f1f5f9;}
.container{max-width:1200px;margin:auto;}
.title{text-align:center;margin-bottom:30px;}
.title h1{color:#1f2937;font-size:42px;}
.title p{color:#6b7280;margin-top:8px;}
.logo{font-size:60px;margin-bottom:10px;}
.line{width:80px;height:4px;background:#7c3aed;margin:15px auto;border-radius:20px;}
.card{background:#faf8ff;padding:30px;border-radius:20px;box-shadow:0 5px 20px rgba(0,0,0,0.08);}
.form-row{display:flex;gap:15px;flex-wrap:wrap;}
input,select,button{padding:14px;border:1px solid #ddd;border-radius:10px;font-size:15px;}
button{cursor:pointer;font-weight:600;}
.generate-btn{background:linear-gradient(90deg,#7c3aed,#9333ea);color:white;}
.generate-btn:hover{background:#6d28d9;}
.clear-btn{background:white;color:#7c3aed;border:2px solid #7c3aed;}
.clear-btn:hover{background:#f3e8ff;}
.download-btn{background:#16a34a;color:white;text-decoration:none;display:none;padding:14px 20px;border-radius:10px;font-weight:600;width:100%;max-width:300px;margin:15px auto;text-align:center;}
.download-btn:hover{background:#15803d;}
.copy-btn{background:#2563eb;color:white;padding:10px 20px;border-radius:8px;margin-top:10px;display:none;}
.copy-btn:hover{background:#1d4ed8;}
.action-area{text-align:center;margin-top:20px;}
#qrCode{display:flex;justify-content:center;margin-top:25px;}
#qrCode img{background:white;padding:15px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,0.1);}
.history-title{margin-top:40px;margin-bottom:15px;font-size:28px;color:#1f2937;}
.counter{font-size:18px;margin-bottom:10px;}
.search-box{margin-bottom:15px;}
.search-box input{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;}
table{width:100%;border-collapse:collapse;background:white;border-radius:15px;overflow:hidden;box-shadow:0 5px 20px rgba(0,0,0,0.08);}
th{background:linear-gradient(90deg,#7c3aed,#8b5cf6);color:white;padding:15px;font-weight:600;}
td{padding:15px;border-bottom:1px solid #eee;text-align:center;}
.preview{width:70px;}
.history-download{background:#7c3aed;color:white;padding:8px 15px;border-radius:8px;text-decoration:none;}
.history-download:hover{background:#6d28d9;}
.dark-toggle{margin-top:20px;cursor:pointer;font-size:18px;}
</style>
</head>
<body>
<div class="title">
<div class="logo">📱</div>
<h1>QR Code Generator</h1>
<p>Create, Preview & Download QR Codes Instantly</p>
<div class="line"></div>
</div>

<div class="card">
<div class="form-row">
<input type="text" id="textInput" placeholder="Enter URL or Text">
<select id="qrSize">
<option value="150">Small (150x150)</option>
<option value="200" selected>Medium (200x200)</option>
<option value="300">Large (300x300)</option>
</select>
<button class="generate-btn" onclick="generateQR()">Generate QR</button>
</div>

<div id="qrCode"></div>

<div class="action-area">
<a id="downloadBtn" class="download-btn">Download Current QR</a>
<button id="copyBtn" class="copy-btn" onclick="copyLink()">📋 Copy Link</button>
<br><br>
<button class="clear-btn" onclick="clearHistory()">Clear History</button>
<button class="clear-btn" onclick="exportHistory()">Export History</button>
<div class="dark-toggle" onclick="toggleDarkMode()">🌙 Dark Mode</div>
</div>
</div>

<h2 class="history-title">QR History</h2>
<div class="counter" id="qrCounter">Total QR Generated: 0</div>
<div class="search-box"><input type="text" id="searchInput" placeholder="Search URL..." onkeyup="searchHistory()"></div>

<table>
<thead>
<tr>
<th>Text / URL</th>
<th>QR Preview</th>
<th>Date & Time</th>
<th>Download</th>
</tr>
</thead>
<tbody id="historyTable"></tbody>
</table>

<script>
function generateQR(){
let text=document.getElementById("textInput").value.trim();
let size=parseInt(document.getElementById("qrSize").value);
if(text===""){alert("Please enter URL or Text");return;}
document.getElementById("qrCode").innerHTML="";
new QRCode(document.getElementById("qrCode"),{text:text,width:size,height:size});
setTimeout(()=>{
let img=document.querySelector("#qrCode img");
if(img){
let history=JSON.parse(localStorage.getItem("qrHistory"))||[];
history.push({text:text,date:new Date().toLocaleString(),image:img.src});
localStorage.setItem("qrHistory",JSON.stringify(history));
let btn=document.getElementById("downloadBtn");
btn.href=img.src;btn.download="qrcode_"+Date.now()+".png";btn.style.display="inline-block";
document.getElementById("copyBtn").style.display="inline-block";
loadHistory();
document.getElementById("textInput").value="";
}},500);
}
function copyLink(){
let text=document.getElementById("textInput").value.trim();
if(text!==""){navigator.clipboard.writeText(text);alert("Link copied to clipboard!");}
}
function loadHistory(){
let history=JSON.parse(localStorage.getItem("qrHistory"))||[];
document.getElementById("qrCounter").innerText="Total QR Generated: "+history.length;
if(history.length===0){document.getElementById("historyTable").innerHTML='<tr><td colspan="4">No QR History Found</td></tr>';return;}
let table="";
history.reverse().forEach(item=>{
table+=`<tr><td>${item.text}</td><td><img src="${item.image}" class="preview"></td><td>${item.date}</td><td><a href="${item.image}" download="qrcode.png" class="history-download">⬇ Download</a></td></tr>`;
});
document.getElementById("historyTable").innerHTML=table;
}
function searchHistory(){
let input=document.getElementById("searchInput").value.toLowerCase();
let history=JSON.parse(localStorage.getItem("qrHistory"))||[];
let filtered=history.filter(item=>item.text.toLowerCase().includes(input));
let table="";
filtered.reverse().forEach(item=>{
table+=`<tr><td>${item.text}</td><td><img src="${item.image}" class="preview"></td><td>${item.date}</td><td><a href="${item.image}" download="qrcode.png" class="history-download">⬇ Download</a></td></tr>`;
});
document.getElementById("historyTable").innerHTML=table||'<tr><td colspan="4">No Match Found</td></tr>';
}
function clearHistory(){
localStorage.removeItem("qrHistory");
document.getElementById("historyTable").innerHTML="";
document.getElementById("qrCode").innerHTML="";
document.getElementById("downloadBtn").style.display="none";
document.getElementById("copyBtn").style.display="none";
document.getElementById("qrCounter").innerText="Total QR Generated: 0";
alert("History Cleared Successfully");
}
function exportHistory(){
let history=JSON.parse(localStorage.getItem("qrHistory"))||[];
if(history.length===0){alert("No history to export");return;}
let csv="Text,Date\n";
history.forEach(item=>{csv+=`${item.text},${item.date}\n`;});
let blob=new Blob([csv],{type:"text/csv"});
let link=document.createElement("a");
link.href=URL.createObjectURL(blob);
link.download="qr_history.csv";
link.click();
}
function toggleDarkMode(){document.body.classList.toggle("dark-mode");}
loadHistory();
</script>
</body>
</html>
