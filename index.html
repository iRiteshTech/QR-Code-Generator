<!DOCTYPE html>
<html>
<head>
<title>QR Code Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
    font-family:Arial;
    text-align:center;
    margin:20px;
}

input{
    padding:10px;
    width:300px;
}

button{
    padding:10px;
    cursor:pointer;
}

#qrCode{
    margin-top:20px;
}

table{
    width:100%;
    margin-top:20px;
    border-collapse:collapse;
}

th,td{
    border:1px solid black;
    padding:10px;
}

.preview{
    width:60px;
}
img{
    user-select:none;
}

#qrCode{
    user-select:none;
}
</style>

</head>
<body>

<h2>QR Code Generator</h2>

<input type="text" id="textInput" placeholder="Enter URL or Text">

<select id="qrSize">
    <option value="150">Small (150x150)</option>
    <option value="200" selected>Medium (200x200)</option>
    <option value="300">Large (300x300)</option>
</select>

<button onclick="generateQR()">Generate QR</button>

<div id="qrCode"></div>

<br>

<a id="downloadBtn" style="display:none;">
<button>Download Current QR</button>
</a>
<button onclick="clearHistory()">Clear History</button>
<br><br>

<h3>QR History</h3>

<table>
<thead>
<tr>
<th>Text / URL</th>
<th>QR Preview</th>
<th>Date & Time</th>
<th>Download</th>
</tr>
</thead>

<tbody id="historyTable"></tbody>

</table>

<script>

function generateQR(){

let text=document.getElementById("textInput").value;
let size=parseInt(document.getElementById("qrSize").value);

if(text.trim()==""){
    alert("Please enter text or URL");
    return;
}

document.getElementById("qrCode").innerHTML="";

new QRCode(document.getElementById("qrCode"),{
    text:text,
    width:size,
    height:size
});

setTimeout(()=>{

let img=document.querySelector("#qrCode img");

if(img){

document.getElementById("downloadBtn").href=img.src;
document.getElementById("downloadBtn").download="qrcode_"+Date.now()+".png";
document.getElementById("downloadBtn").style.display="inline";

let history=JSON.parse(localStorage.getItem("qrHistory")) || [];

history.push({
    text:text,
    date:new Date().toLocaleString(),
    image:img.src
});

localStorage.setItem(
    "qrHistory",
    JSON.stringify(history)
);

loadHistory();
window.getSelection().removeAllRanges();
document.getElementById("textInput").value = "";

}

},500);

}

function loadHistory(){

let history=JSON.parse(localStorage.getItem("qrHistory")) || [];

let table="";

history.slice().reverse().forEach(item=>{

table+=`
<tr>
<td>${item.text}</td>

<td>
<img src="${item.image}" class="preview">
</td>

<td>${item.date}</td>

<td>
<a href="${item.image}"
download="qrcode_${new Date().getTime()}.png">
<button>Download</button>
</a>
</td>

</tr>
`;

});

document.getElementById("historyTable").innerHTML=table;

}

loadHistory();
function clearHistory(){

localStorage.removeItem("qrHistory");

document.getElementById("historyTable").innerHTML = "";

alert("History Cleared Successfully");

}

console.log("Script Loaded");

</script>

</body>
</html>
